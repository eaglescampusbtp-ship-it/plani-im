<style>
/* Layout: client-space dashboard in a legaltech spirit. Calm white cards on a cool canvas, one strong blue, dossier-style status steppers, and charts that open a detail window when tapped. Mobile-first with a bottom nav. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#0D1B2C; --ink2:#2C3E52; --muted:#5A7189; --line:#DDE3E9; --line2:#C3CDD8;
  --brand:#1E4E8C; --brand-hi:#173E70; --brand-soft:#E3ECF7; --onbrand:#FFFFFF;
  --sun:#F2B230; --sun-soft:#FDF1D6; --onsun:#1A1405;
  --deck:#0F2A47; --deck2:#163759; --ondeck:#FFFFFF; --ondeck2:#B9C9DB; --grid:rgba(255,255,255,.055);
  --ok:#1E8A5A; --ok-soft:#DFF2E8; --warn:#9A5B00; --warn-soft:#FCEFD6; --bad:#C8402E; --bad-soft:#FBE7E3;
  --s1:#1E4E8C; --s2:#E0892B; --s3:#1E8A5A;
  --shade:rgba(10,22,38,.5);
  --sh-sm:0 1px 0 rgba(13,27,44,.04),0 1px 3px rgba(13,27,44,.06);
  --sh-lg:0 18px 48px rgba(13,27,44,.22);
  --f-ui:"Archivo","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:16px; --r-md:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1626; --surface:#0F1F33; --surface2:#15283F; --ink:#E7EDF4; --ink2:#C4D0DD; --muted:#8FA3B9; --line:#1E3350; --line2:#2C4668;
  --brand:#7FB0F0; --brand-hi:#A3C7F5; --brand-soft:#16304F; --onbrand:#07121F;
  --sun:#F5BE45; --sun-soft:#3A2E10; --onsun:#1A1405;
  --deck:#10304F; --deck2:#17406A; --ondeck:#FFFFFF; --ondeck2:#AFC3D9; --grid:rgba(255,255,255,.05);
  --ok:#45C489; --ok-soft:#10301F; --warn:#F2B347; --warn-soft:#3A2A0E; --bad:#F2806E; --bad-soft:#3F1D19;
  --s1:#7FB0F0; --s2:#F0A050; --s3:#45C489;
  --shade:rgba(0,0,0,.62); --sh-sm:0 1px 2px rgba(0,0,0,.35); --sh-lg:0 18px 48px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1626; --surface:#0F1F33; --surface2:#15283F; --ink:#E7EDF4; --ink2:#C4D0DD; --muted:#8FA3B9; --line:#1E3350; --line2:#2C4668;
  --brand:#7FB0F0; --brand-hi:#A3C7F5; --brand-soft:#16304F; --onbrand:#07121F;
  --sun:#F5BE45; --sun-soft:#3A2E10; --onsun:#1A1405;
  --deck:#10304F; --deck2:#17406A; --ondeck:#FFFFFF; --ondeck2:#AFC3D9; --grid:rgba(255,255,255,.05);
  --ok:#45C489; --ok-soft:#10301F; --warn:#F2B347; --warn-soft:#3A2A0E; --bad:#F2806E; --bad-soft:#3F1D19;
  --s1:#7FB0F0; --s2:#F0A050; --s3:#45C489;
  --shade:rgba(0,0,0,.62); --sh-sm:0 1px 2px rgba(0,0,0,.35); --sh-lg:0 18px 48px rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 150px}
.mono{font-family:var(--f-mono);font-size:.9em;letter-spacing:0}
.sp{flex:1}
svg{flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:11px;display:flex;align-items:center;gap:18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.02em;color:var(--ink)}
.logo:hover{text-decoration:none}
.logo-m{width:32px;height:32px;border-radius:10px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;position:relative}
.logo-m svg{width:18px;height:18px}
.logo-m::after{content:"";position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--sun);border:2px solid var(--surface)}
.tnav{display:flex;gap:2px}
.tnav a{padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px}
.tnav a:hover{background:var(--surface2);text-decoration:none;color:var(--ink)}
.tnav a.on{color:var(--brand);background:var(--brand-soft)}
.today{font-size:13px;color:var(--muted);font-weight:600}
@media (max-width:860px){.tnav,.today{display:none}}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11.5px;font-weight:700;min-width:0}
.bnav a:hover{text-decoration:none}
.bnav a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.bnav a svg{width:22px;height:22px}
.bnav a.on{color:var(--brand)}
.bnav a.on .bi{background:var(--brand-soft)}
.bi{display:grid;place-items:center;width:46px;height:28px;border-radius:999px}
@media (min-width:861px){.bnav{display:none}}

/* type */
h1{font-size:clamp(26px,5.4vw,34px);font-weight:800;letter-spacing:-.028em;line-height:1.12;margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.25;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}
.kick{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--brand);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.lnk svg{width:15px;height:15px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--sh-sm)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-h .sub{font-size:13px;color:var(--muted);margin-top:3px}
.card>.list{margin:0 -18px -18px;border:0;border-top:1px solid var(--line);border-radius:0 0 var(--r-lg) var(--r-lg)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;margin-top:18px}
@media (min-width:860px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.span2{grid-column:1/-1}}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r-md);font-size:14px}
.card .empty{border-radius:12px}
.note{font-size:13.5px;color:var(--ink2);background:var(--surface2);border-radius:12px;padding:11px 13px}
.ai{border-radius:12px;padding:12px 13px;font-size:13.5px;line-height:1.45;border:1px solid var(--line)}
.ai.wait{background:var(--sun-soft);color:var(--ink);border-color:transparent}
.ai.done{background:var(--ok-soft);color:var(--ink);border-color:transparent}
.ai b{display:block;font-size:13px;margin-bottom:4px}
.ai ul{margin:8px 0 0;padding-left:18px}.ai li{margin:3px 0}
.ai .btn{margin-top:10px}
.note.warn{background:var(--warn-soft);color:var(--ink)}
.note.brand{background:var(--brand-soft);color:var(--ink)}
.cap{font-size:12.5px;color:var(--muted)}

/* hero */
.hero{margin-top:18px;background:var(--brand-soft);border-radius:24px;padding:22px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.hero .date{font-size:13.5px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.hstats{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hstat{background:var(--surface);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--muted);display:flex;align-items:baseline;gap:6px;font-weight:600}
.hstat b{font-size:17px;color:var(--ink);font-weight:800}
.hstat b.bad{color:var(--bad)}
.hero-art{width:116px;height:auto}
@media (max-width:520px){.hero-art{width:78px}.hero{padding:18px 16px}}
.ha-w{fill:var(--surface);stroke:var(--brand);stroke-width:2.4}
.ha-r{fill:var(--sun);stroke:var(--brand);stroke-width:2.4;stroke-linejoin:round}
.ha-l{stroke:var(--brand);stroke-width:2.4;fill:none;stroke-linecap:round}
.ha-d{stroke:var(--line2);stroke-width:1.6;fill:none;stroke-dasharray:3 3}
.ha-f{fill:var(--brand-soft);stroke:var(--brand);stroke-width:2}

/* pills, codes */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;line-height:1.3}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.pill.plain::before{display:none}
.code{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--brand);background:var(--brand-soft);border-radius:7px;padding:2px 7px;white-space:nowrap}

/* project header */
.crumbs{display:flex;gap:6px;align-items:center;margin-top:18px;font-size:13px;color:var(--muted);flex-wrap:wrap;font-weight:600}
.crumbs button{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-weight:700}
.crumbs svg{width:14px;height:14px}
.phead{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.pmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* segmented tabs */
.seg{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:18px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--brand);color:var(--onbrand)}
.seg .n{font-size:11px;font-weight:800;background:var(--surface2);color:var(--muted);border-radius:6px;padding:0 6px}
.seg button[aria-selected="true"] .n{background:color-mix(in srgb,var(--onbrand) 22%,transparent);color:var(--onbrand)}

/* list rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .t{font-weight:700;line-height:1.3;overflow-wrap:anywhere;font-size:14.5px}
.row .m{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.row .m a{font-weight:700}
.row .e{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.amt{font-weight:800;white-space:nowrap;font-size:14.5px}
.amt.mute{color:var(--muted);font-weight:600}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.ic svg{width:19px;height:19px}
.ic.ok{background:var(--ok-soft);color:var(--ok)} .ic.warn{background:var(--warn-soft);color:var(--warn)} .ic.bad{background:var(--bad-soft);color:var(--bad)} .ic.mute{background:var(--surface2);color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line2);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;margin:0 6px}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.late{color:var(--bad);font-weight:700}
.miss{color:var(--warn);font-weight:700}
.mbar{height:6px;border-radius:3px;background:var(--surface2);margin-top:8px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--brand);border-radius:0 3px 3px 0}
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 2px;cursor:pointer;text-align:left;width:100%}
.grp-h .nm{font-weight:800;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-h .tot{margin-left:auto;font-weight:800;font-size:14px;white-space:nowrap}
.grp-h .cnt{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .kpi{background:var(--surface2);border:0}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.kpi .s{font-size:12.5px;color:var(--muted)}
.v.bad,.bad-t{color:var(--bad)} .v.ok,.ok-t{color:var(--ok)}

/* gauge */
.gauge{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center}
.ring{width:136px;height:136px}
.rg-trk{stroke:var(--surface2)} .rg-brand{stroke:var(--brand)} .rg-ok{stroke:var(--ok)} .rg-bad{stroke:var(--bad)}
.rg-big{fill:var(--ink);font-family:var(--f-ui);font-weight:800;font-size:27px}
.rg-sm{fill:var(--muted);font-family:var(--f-ui);font-weight:600;font-size:12px}
.gstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.gstat{display:flex;flex-direction:column;gap:2px;min-width:0}
.gstat .l{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.gstat .v{font-size:18px;font-weight:800;letter-spacing:-.015em}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
@media (max-width:440px){.gauge{grid-template-columns:1fr;justify-items:center}.gstats{width:100%}}

/* mini ring on project cards */
.mring{width:46px;height:46px}

/* horizontal bars */
.hb{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.hb-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;background:none;border:0;text-align:left;width:100%}
.hb-row:hover{background:var(--surface2)}
.hb-lab{font-size:13.5px;font-weight:700;display:flex;gap:8px;align-items:center;min-width:0}
.hb-lab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-val{font-size:13.5px;font-weight:800;text-align:right;white-space:nowrap}
.hb-pct{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.hb-trk{grid-column:1/-1;height:10px;border-radius:4px;background:var(--surface2);position:relative;overflow:hidden}
.hb-bar{position:absolute;left:0;top:0;bottom:0;background:var(--brand);border-radius:0 4px 4px 0}

/* gantt */
.gantt{display:flex;flex-direction:column;gap:2px;overflow-x:auto}
.g-row,.g-axis{display:grid;grid-template-columns:minmax(104px,34%) minmax(0,1fr);gap:10px;align-items:center}
.g-row{padding:4px 6px;margin:0 -6px;border-radius:10px;cursor:pointer;background:none;border:0;text-align:left;width:calc(100% + 12px)}
.g-row:hover{background:var(--surface2)}
.g-lab{font-size:13px;font-weight:700;display:flex;gap:6px;align-items:center;min-width:0}
.g-lab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-lab .d{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
.g-trk{position:relative;height:22px}
.g-grid{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--line)}
.g-bar{position:absolute;top:4px;bottom:4px;border-radius:4px;background:var(--brand);min-width:4px}
.g-bar.st1{background:var(--warn)} .g-bar.st2{background:var(--ok)}
.g-ticks{position:relative;height:18px}
.g-tick{position:absolute;top:0;transform:translateX(-50%);font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.own .a-plan{grid-column:1/-1}
.own .a-prog{grid-column:1/-1}
@media (min-width:860px){.own{grid-template-areas:"prog prog" "gauge lots" "sup lots" "plan plan" "devis tasks" "trip trip"}.own .a-prog{grid-area:prog}.own .a-gauge{grid-area:gauge}.own .a-lots{grid-area:lots}.own .a-sup{grid-area:sup}.own .a-plan{grid-area:plan}.own .a-devis{grid-area:devis}.own .a-tasks{grid-area:tasks}.own .a-trip{grid-area:trip}}
@media (max-width:600px){.g-row,.g-axis{grid-template-columns:minmax(0,1fr);gap:4px}.g-row{padding:6px}.g-axis>span:first-child{display:none}.g-lab .nm{white-space:normal}}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){th,td{padding:9px 8px;font-size:13px}table{min-width:0}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* month chart */
.mc{display:flex;flex-direction:column;gap:6px}
.mc-plot{position:relative;height:180px}
.mc-zero{position:absolute;left:0;right:0;height:1px;background:var(--line2)}
.mc-cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.mc-col{position:relative;cursor:pointer}
.mc-bar{position:absolute;left:14%;right:14%;background:var(--s1)}
.mc-bar.pos{border-radius:4px 4px 0 0}
.mc-bar.neg{background:var(--bad);border-radius:0 0 4px 4px}
.mc-col:hover .mc-bar{filter:brightness(1.1)}
.mc-v{position:absolute;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:800;white-space:nowrap;color:var(--ink)}

function sbErr(res){if(res&&res.error){const e=new Error(res.error.message||"db");e.code=res.error.code==="42501"?"denied":(res.error.code||"db");throw e}return res}
function debounce(fn,ms){let t=null;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}
function sbChannel(sb,table,fn){
  try{return sb.channel("pi-"+table+"-"+Math.random().toString(36).slice(2,8)).on("postgres_changes",{event:"*",schema:"public",table},()=>fn()).subscribe()}catch(_){return null}
}
function makeDb(sb){
  const T={projects:"pi_projects",items:"pi_items"};
  const kick=k=>{const f=RELOAD[k];if(f)f()};
  function collection(name){
    const table=T[name];
    return{
      onSnapshot(cb,err){
        let alive=true;
        const load=async()=>{
          let r;try{r=await sb.from(table).select("id,data")}catch(e){r={error:e}}
          if(!alive)return;
          if(r.error){if(err)err(r.error);return}
          cb({docs:(r.data||[]).map(x=>({id:x.id,data:()=>x.data||{}}))});
        };
        const trig=debounce(load,200);RELOAD[name]=trig;
        load();
        const ch=sbChannel(sb,table,trig);
        return()=>{alive=false;if(ch)sb.removeChannel(ch)};
      },
      doc(id){
        return{
          set:async d=>{sbErr(await sb.from(table).upsert({id,data:d,updated_at:new Date().toISOString()}));kick(name)},
          update:async p=>{sbErr(await sb.rpc("pi_merge",{p_table:name,p_id:id,p_patch:p}));kick(name)},
          delete:async()=>{sbErr(await sb.from(table).delete().eq("id",id));kick(name)}
        };
      }
    };
  }
  function doc(path){
    const key="doc:"+path;
    return{
      onSnapshot(cb,err){
        let alive=true;
        const load=async()=>{
          let r;try{r=await sb.from("pi_docs").select("data").eq("path",path).maybeSingle()}catch(e){r={error:e}}
          if(!alive)return;
          if(r.error){if(err)err(r.error);return}
          const row=r.data;cb({exists:!!row,data:()=>row?row.data:null});
        };
        const trig=debounce(load,200);RELOAD[key]=trig;
        load();
        const ch=sbChannel(sb,"pi_docs",trig);
        return()=>{alive=false;if(ch)sb.removeChannel(ch)};
      },
      set:async d=>{sbErr(await sb.from("pi_docs").upsert({path,data:d,updated_at:new Date().toISOString()}));kick(key)},
      update:async p=>{sbErr(await sb.rpc("pi_merge",{p_table:"docs",p_id:path,p_patch:p}));kick(key)}
    };
  }
  return{collection,doc};
}
function makeAssets(sb){

    async upload(file,opts){
      const ct=(opts&&opts.type)||file.type||"application/octet-stream";
      const nm=(String(file.name||"skedar").normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^\w.\-]+/g,"_").replace(/_+/g,"_").slice(-80))||"skedar";
      const path=`${todayISO()}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}-${nm}`;
      const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:ct,upsert:false,cacheControl:"3600"});
      if(error){const m=String(error.message||"")+" "+String(error.statusCode||"");const e=new Error(m);e.code=/exceed|size|large|413/i.test(m)?"too_large":/mime|type/i.test(m)?"unsupported_type":/row-level|security|403|unauthor/i.test(m)?"denied":"upload_failed";throw e}
      return{id:path,url:"",contentType:ct,sizeBytes:file.size};
    },
    async delete(id){try{await sb.storage.from(BUCKET).remove([id])}catch(_){}}
  };
}
/* signed links for private files */
const SIGNED=new Map();
async function signedUrl(id,ttl,download){
  ttl=ttl||3600;const k=id+"|"+(download||"");const c=SIGNED.get(k);
  if(c&&c.exp>Date.now()+60e3)return c.url;
  const {data,error}=await SB.storage.from(BUCKET).createSignedUrl(id,ttl,download?{download}:undefined);
  if(error||!data)throw error||new Error("sign");
  SIGNED.set(k,{url:data.signedUrl,exp:Date.now()+ttl*1000});return data.signedUrl;
}
function hydrateBlobs(){
  if(!SB)return;
  document.querySelectorAll("img[data-blob]:not([data-hyd])").forEach(im=>{
    im.dataset.hyd="1";
    signedUrl(im.dataset.blob).then(u=>{im.src=u}).catch(()=>{im.style.display="none"});
  });
}
new MutationObserver(()=>hydrateBlobs()).observe(document.documentElement,{childList:true,subtree:true});

function sorted(type,arr){
  const a=[...arr];
  if(type==="tache")return a.sort((x,y)=>(!!x.done-!!y.done)||String(x.due||"9999").localeCompare(String(y.due||"9999"))||PRIO.indexOf(x.prio||"Normale")-PRIO.indexOf(y.prio||"Normale"));
  if(type==="lot")return lotsOf(arr[0]?.pid);
  if(type==="rdv")return a.sort((x,y)=>String(x.date||"").localeCompare(String(y.date||"")));
  if(type==="contact"||type==="info")return a.sort((x,y)=>(x.order??0)-(y.order??0)||String(x.title).localeCompare(String(y.title)));
  if(type==="achat")return a.sort((x,y)=>String(x.id).localeCompare(String(y.id),undefined,{numeric:true}));

function lotStats(pid,lotId){
  const f=t=>its(pid,t).filter(i=>i.lotId===lotId);
  const devis=f("devis"),achats=f("achat"),fact=f("facture");
  return{devis,achats,fact,
    devisOk:devis.filter(d=>d.status==="Pranuar").reduce((s,d)=>s+num(d.amount),0),
    achatSum:achats.reduce((s,a)=>s+achatTotal(a),0),
    factSum:fact.reduce((s,x)=>s+num(x.amount),0),
    unpriced:achats.filter(a=>a.status!=="E kam"&&!num(a.unitPrice)).length};
}
function ownStats(p){
  const achats=its(p.id,"achat"),fact=its(p.id,"facture"),lots=its(p.id,"lot");
  const planned=achats.reduce((s,a)=>s+achatTotal(a),0);
  const invoiced=fact.reduce((s,x)=>s+num(x.amount),0);
  const paid=fact.filter(x=>x.paid).reduce((s,x)=>s+num(x.amount),0);
  const budget=num(p.budget);
  const days=lots.reduce((s,l)=>s+num(l.poseDays),0);
  const pr=Object.assign({workers:2,daysPerWeekend:2,tripsPerMonth:2,km:350,cons:6.5,fuel:1.7,tolls:0},p.params||{});
  const perWeekend=Math.max(1,num(pr.workers)*num(pr.daysPerWeekend));
  const weekends=days?Math.ceil(days/perWeekend):0;
  const months=num(pr.tripsPerMonth)?Math.ceil(weekends/num(pr.tripsPerMonth)):0;
  const liters=num(pr.km)*2*num(pr.cons)/100;
  const trip=liters*num(pr.fuel)+num(pr.tolls);
  const tripMonth=trip*num(pr.tripsPerMonth);
  const toBuy=achats.filter(a=>a.status!=="E kam");
  const unpriced=toBuy.filter(a=>!num(a.unitPrice)).length;
  const bought=toBuy.filter(a=>a.status==="Mbërritur").length;
  return{planned,invoiced,paid,budget,left:budget-planned,days,pr,perWeekend,weekends,months,liters,trip,tripMonth,unpriced,toBuy:toBuy.length,bought,have:achats.length-toBuy.length,
    devisWait:its(p.id,"devis").filter(d=>["Për t'u kërkuar","Në pritje"].includes(d.status)).length};
}
function ownProg(p){
  const achats=its(p.id,"achat"),lots=its(p.id,"lot");
  const got=achats.filter(a=>a.status==="E kam"||a.status==="Mbërritur").length;
  const ordered=achats.filter(a=>a.status==="Porositur").length;
  const mat=achats.length?got/achats.length:0;
  const W={"Pa filluar":0,"Në punë":.5,"Përfunduar":1};
  const days=lots.reduce((s,l)=>s+num(l.poseDays),0);
  const doneDays=lots.reduce((s,l)=>s+num(l.poseDays)*(l.status==="Përfunduar"?1:0),0);
  const wipDays=lots.reduce((s,l)=>s+num(l.poseDays)*(l.status==="Në punë"?.5:0),0);
  const useDays=days>0;
  const work=useDays?(doneDays+wipDays)/days:(lots.length?lots.reduce((s,l)=>s+(W[l.status]||0),0)/lots.length:0);
  return{mat,got,ordered,nAch:achats.length,work,lotsDone:lots.filter(l=>l.status==="Përfunduar").length,lotsWip:lots.filter(l=>l.status==="Në punë").length,nLots:lots.length,days,doneDays,useDays,
    doneShare:useDays?doneDays/days:0,wipShare:useDays?(lots.reduce((s,l)=>s+(l.status==="Në punë"?num(l.poseDays):0),0))/days:0};
}

function monthChart(months,mini){
  const vals=months.map(m=>m.left),max=Math.max(0,...vals),min=Math.min(0,...vals);
  const padTop=mini?0:.16,padBot=mini?0:(min<0?.16:.02);
  const span=(max-min)||1,lo=min-span*padBot,hi=max+span*padTop,rng=hi-lo;
  const y=v=>(hi-v)/rng*100,zero=y(0);
  const cols=months.map((m,i)=>{
    const v=m.left,top=v>=0?y(v):zero,h=Math.max(.8,Math.abs(y(v)-zero));
    const show=!mini&&(i===0||v!==months[i-1].left);
    const lab=show?`<span class="mc-v" style="${v>=0?`bottom:${(100-top+1.5).toFixed(2)}%`:`top:${(top+h+1.5).toFixed(2)}%`}">${sgn(v)}</span>`:"";
    return`<div class="mc-col" data-tip="${esc(m.label)}: hyrje ${eur(m.inc)} · dalje ${eur(m.com+m.fixed+m.trip)} · mbeten ${sgn(v)}"><span class="mc-bar ${v<0?"neg":"pos"}" style="top:${top.toFixed(2)}%;height:${h.toFixed(2)}%"></span>${lab}</div>`;
  }).join("");
  return`<div class="mc ${mini?"mini":""}" style="--n:${months.length}"><div class="mc-plot"><span class="mc-zero" style="top:${zero.toFixed(2)}%"></span><div class="mc-cols">${cols}</div></div>${mini?"":`<div class="mc-x">${months.map(m=>`<span>${esc(m.label.split(" ")[0])}</span>`).join("")}</div>`}</div>`;
}

/* ---------- AI / Gemini ---------- */
const AI={msgs:[],reviews:[],loading:false,analyzing:false};
const GEMINI_FN=SB_URL+"/functions/v1/gemini-analyze";

async function aiCall(action,body){
  const token=SB?.auth?.session?.()?.access_token||(await SB?.auth?.getSession?.())?.data?.session?.access_token;
  if(!token)throw new Error("Nuk je i identifikuar.");
  const opts={method:body?"POST":"GET",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json","apikey":SB_KEY}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(GEMINI_FN+"?action="+action,opts);
  if(!r.ok){const t=await r.text();throw new Error(t||r.statusText)}
  return r.json();
}

async function aiSend(){
  const inp=document.getElementById("ai-inp");
  if(!inp)return;
  const msg=inp.value.trim();
  if(!msg)return;
  inp.value="";
  AI.msgs.push({role:"user",text:msg});
  renderAiMsgs();
  AI.loading=true;
  renderAiMsgs();
  try{
    const res=await aiCall("chat",{message:msg});
    AI.msgs.push({role:"bot",text:res.reply||"(pa përgjigje)"});
  }catch(e){
    AI.msgs.push({role:"bot",text:"Gabim: "+e.message,err:true});
  }
  AI.loading=false;
  renderAiMsgs();
}

async function aiAnalyze(){
  if(AI.analyzing)return;
  AI.analyzing=true;
  const el=document.getElementById("ai-status");
  if(el)el.innerHTML='<div class="ai-loading">Po analizon të dhënat me Gemini…</div>';
  try{
    const res=await aiCall("analyze");
    toast("Analiza përfundoi: "+(res.found||0)+" çështje");
    await aiLoadReviews();
  }catch(e){
    toast("Gabim: "+e.message);
  }
  AI.analyzing=false;
  renderAiReviews();
}

async function aiLoadReviews(){
  try{
    const res=await aiCall("pending");
    AI.reviews=res.reviews||[];
  }catch(e){AI.reviews=[];console.warn(e)}
  renderAiReviews();
}

async function aiAction(id,act){
  try{
    await aiCall(act,{review_id:id});
    toast(act==="approve"?"U miratua!":"U refuzua.");
    AI.reviews=AI.reviews.filter(r=>r.id!==id);
    renderAiReviews();
  }catch(e){toast("Gabim: "+e.message)}
}

function renderAiMsgs(){
  const c=document.getElementById("ai-msgs");
  if(!c)return;
  let h=AI.msgs.map(m=>`<div class="ai-msg ${m.role==="user"?"user":"bot"}${m.err?" err":""}">${esc(m.text)}</div>`).join("");
  if(AI.loading)h+=`<div class="ai-msg bot" style="opacity:.6">Po mendon…</div>`;
  if(!h)h=`<div class="ai-empty">Shkruaj diçka për të biseduar me AI</div>`;
  c.innerHTML=h;
  c.scrollTop=c.scrollHeight;
}

function renderAiReviews(){
  const c=document.getElementById("ai-reviews");
  if(!c)return;
  if(AI.analyzing){c.innerHTML='<div class="ai-loading">Po analizon…</div>';return}
  if(!AI.reviews.length){c.innerHTML=`<div class="ai-empty">Nuk ka çështje në pritje</div>`;return}
  c.innerHTML=AI.reviews.map(r=>`
    <div class="ai-review ${r.severity||"medium"}">
      <div class="rv-head"><span class="rv-type">${esc(r.issue_type||"çështje")}</span><span class="rv-sev ${r.severity||"medium"}">${r.severity==="high"?"E lartë":r.severity==="low"?"E ulët":"Mesatare"}</span></div>
      <div class="rv-desc">${esc(r.description)}</div>

      <div class="rv-acts"><button class="rv-ok" onclick="aiAction(${r.id},'approve')">✓ Mirato</button><button class="rv-no" onclick="aiAction(${r.id},'dismiss')">✗ Refuzo</button></div>
    </div>`).join("");
}

  const late=x.due&&!x.done&&x.due<todayISO();
  const meta=[showP&&x.pname?esc(x.pname):"",x.due?`<span class="${late?"late":""}">${late?"Vonesë · ":""}${fdate(x.due)}</span>`:"",x.notes?esc(String(x.notes).slice(0,70)):""].filter(Boolean).join(" · ");
  return`<div class="row ${x.done?"done":""}" data-act="open" data-id="${esc(x.id)}" role="button" tabindex="0"><button type="button" class="check ${x.done?"on":""}" data-act="toggle" data-id="${esc(x.id)}" aria-label="${x.done?"Rihap detyrën":"Shëno si të kryer"}"></button><div><div class="t">${esc(x.title)}</div>${meta?`<div class="m">${meta}</div>`:""}</div><div class="e">${Array.isArray(x.checklist)&&x.checklist.length?`<span class="pcl">${x.checklist.filter(c=>c&&c.done).length}/${x.checklist.length}</span>`:""}${x.prio==="Lartë"&&!x.done?pill("Lartë"):""}</div></div>`;
}
function R(x,{ic,t,m,m2,e,act}){
  return`<div class="row" data-act="${act||"open"}" data-id="${esc(x.id)}" role="button" tabindex="0" data-s="${esc([x.title,x.supplier,x.ref,x.notes].filter(Boolean).join(" ").toLowerCase())}"><span class="ic ${ic||""}">${ico(TYPE_IC[x.type]||"note")}</span><div><div class="t">${t??esc(x.title)}</div>${m?`<div class="m">${m}</div>`:""}${m2?`<div class="m">${m2}</div>`:""}</div><div class="e">${e||""}</div></div>`;
}
function rowItem(x,showP){
  const P=showP&&x.pname?esc(x.pname)+" · ":"";
  const L=lotOf(x);
  switch(x.type){
    case"tache":return rowTask(x,showP);
    case"lot":return lotRow(x);
    case"devis":return R(x,{ic:tone(x.status)||"",m:P+[esc(x.supplier),L?esc(lotLabel(L)):"",fdate(x.date)].filter(Boolean).join(" · "),e:`${x.amount?`<span class="amt">${eur(x.amount)}</span>`:""}${pill(x.status)}`});
    case"facture":return R(x,{ic:x.paid?"ok":"warn",m:P+[esc(x.supplier),L?esc(lotLabel(L)):"",fdate(x.date)].filter(Boolean).join(" · "),e:`<span class="amt">${eur(x.amount)}</span>${pill(x.paid?"Paguar":"Pa paguar")}`});
    case"achat":{
      const tot=achatTotal(x),have=x.status==="E kam";
      const m=P+[x.qty?`${num(x.qty).toLocaleString("fr-FR")} ${esc(x.unit||"")}${x.unitPrice?` × ${eur2(x.unitPrice)}`:""}`:"",esc(supName(x.supplier))].filter(Boolean).join(" · ");
      const m2=have?"":(isUrl(x.link)?`${x.ref?`<span class="mono">${esc(x.ref)}</span>`:"Pa referencë"}`:`<span class="miss">Mungon linku</span>`);
      return R(x,{ic:have?"ok":(num(x.unitPrice)?"":"mute"),m,m2,e:have?pill("E kam"):(tot?`<span class="amt">${eur(tot)}</span>${x.status!=="Për t'u blerë"?pill(x.status):""}`:`<span class="pill plain">Pa çmim</span>`)});
    }
    case"contact":return R(x,{ic:"",m:[esc(x.role||""),x.phone?`<span class="mono">${esc(x.phone)}</span>`:""].filter(Boolean).join(" · ")});
    case"info":return R(x,{ic:"mute",m:esc(String(x.value||"").slice(0,160))});
    case"demande":return R(x,{ic:"warn",m:P+[x.qty?`${num(x.qty)} ${esc(x.unit||"")}`:"",fdate(x.date)].filter(Boolean).join(" · "),e:`${pill(x.status)}${x.urgency&&x.urgency!=="Normale"?pill(x.urgency):""}`});
    case"rdv":return R(x,{ic:"",m:P+[fdate(x.date),x.time?esc(x.time):"",esc(x.with),esc(x.place)].filter(Boolean).join(" · ")});
    case"reserve":return R(x,{ic:x.status==="Mbyllur"?"ok":"bad",m:P+[esc(x.severity),fdate(x.date)].filter(Boolean).join(" · "),e:pill(x.status)});
    case"dok":{const n=(x.files||[]).length;return R(x,{ic:x.cat==="Kontratë"?"warn":(x.cat==="Fiche technique"||x.cat==="Plan / vizatim"?"":"mute"),m:P+[esc(x.cat||"Dokument"),esc(x.from||""),fdate(x.date)].filter(Boolean).join(" · "),e:n?`<span class="pill plain">${n} skedar${n>1?"ë":""}</span>`:`<span class="pill plain">Pa skedar</span>`})}
    case"journal":return R(x,{ic:"mute",m:[fdate(x.date),x.notes?esc(String(x.notes).slice(0,100)):""].filter(Boolean).join(" · ")});
    default:return R(x,{ic:"mute",m:x.notes?esc(String(x.notes).slice(0,140)):""});
  }
}
function lotRow(l,maxSum){
  const s=lotStats(l.pid,l.id),w=maxSum?Math.min(100,s.achatSum/maxSum*100):0;
  return`<div class="row" data-act="lot" data-id="${esc(l.id)}" role="button" tabindex="0"><span class="code">${esc(l.code||"L")}</span><div><div class="t">${esc(l.title)}</div><div class="m">${[num(l.poseDays)?`${num(l.poseDays)} ditë pune`:"",`${s.achats.length} blerje`,s.devis.length?`${s.devis.length} devis`:"",s.unpriced?`<span class="miss">${s.unpriced} pa çmim</span>`:""].filter(Boolean).join(" · ")}</div>${maxSum?`<div class="mbar"><i style="width:${w.toFixed(1)}%"></i></div>`:""}</div><div class="e"><span class="amt ${s.achatSum?"":"mute"}">${s.achatSum?eur(s.achatSum):"—"}</span>${pill(l.status||"Pa filluar")}</div></div>`;
}
function listOf(type,arr,emptyMsg){
  if(!arr.length)return`<div class="empty">${emptyMsg||`Asnjë ${TYPES[type].one.toLowerCase()} ende. Shto me butonin +.`}</div>`;
  return`<div class="list">${arr.map(x=>rowItem(x)).join("")}</div>`;
}
function cardList(title,sub,action,type,arr,emptyMsg,cls){
  return`<section class="card ${cls||""}"><div class="card-h"><div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:""}</div>${action||""}</div>${arr.length?`<div class="list">${arr.map(x=>rowItem(x)).join("")}</div>`:`<div class="empty">${emptyMsg}</div>`}</section>`;
}
